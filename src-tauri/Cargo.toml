[package]
name = "trade-copier"
version = "1.0.0"
edition = "2021"
authors = ["Rick in 't Veld"]
license = "MIT"
description = "Professional trade copier for MetaTrader 5 with real-time replication and risk management"
homepage = "https://trading-rocket.nl"
repository = "https://github.com/rickintveld/trade-copier"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
socket2 = "0.5"
rusqlite = { version = "0.30", features = ["bundled"] }
tokio-rusqlite = "0.5"
reqwest = { version = "0.11", features = ["stream", "json"] }
tempfile = "3.8"
chrono = "0.4"
dirs = "5.0"
urlencoding = "2.1"
log = "0.4"
env_logger = "0.11"
sys-info = "0.9"
tauri = { version = "1", features = [ "fs-write-file", "dialog-save", "shell-open"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
