name: Trade Copier Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os-name: windows
          - platform: macos-latest
            os-name: macos

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install pkg-config

      - name: Install frontend dependencies
        run: npm install

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: |
            🚀 Release ${{ github.ref_name }}

            Downloads:
            - Windows (.exe / .msi)
            - macOS (.dmg)
          releaseDraft: true
          prerelease: false

      - name: Rename artifacts
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          
          if [ "${{ matrix.os-name }}" == "windows" ]; then
            # Rename .exe and .msi files
            for file in nsis/*.exe; do
              if [ -f "$file" ]; then
                mv "$file" "nsis/trade-copier.exe"
              fi
            done
            
            for file in msi/*.msi; do
              if [ -f "$file" ]; then
                mv "$file" "msi/trade-copier.msi"
              fi
            done
          elif [ "${{ matrix.os-name }}" == "macos" ]; then
            # Rename .dmg file
            for file in dmg/*.dmg; do
              if [ -f "$file" ]; then
                mv "$file" "dmg/trade-copier.dmg"
              fi
            done
          fi

      - name: Upload renamed artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/nsis/trade-copier.exe
            src-tauri/target/release/bundle/msi/trade-copier.msi
            src-tauri/target/release/bundle/dmg/trade-copier.dmg
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
