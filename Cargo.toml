[package]
name = "trade-copier"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
tokio-rusqlite = "0.5"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", features = ["stream"] }
dirs = "5.0"
tempfile = "3.8"
chrono = "0.4"
